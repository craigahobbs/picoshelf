<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PicoShelf</title>
<meta name="description" content="PicoShelf - Classic books, read aloud. Right in your browser.">
<meta name="apple-mobile-web-app-title" content="PicoShelf">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
    :root {
        --bg: #f7f3ec;
        --surface: #fffdf9;
        --surface-2: #efe9df;
        --text: #221d16;
        --muted: #6f665a;
        --border: #e2d9cb;
        --accent: #8a3b12;
        --accent-text: #ffffff;
        --track: #e2d9cb;
        --error: #b3261e;
        --shadow: 0 1px 2px rgba(60, 40, 20, 0.08), 0 4px 16px rgba(60, 40, 20, 0.08);
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #16130f;
            --surface: #211c17;
            --surface-2: #2b251e;
            --text: #f1ebe2;
            --muted: #a99f92;
            --border: #3a3229;
            --accent: #e49a62;
            --accent-text: #1c120a;
            --track: #3a3229;
            --error: #ff8a80;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
            color-scheme: dark;
        }
    }
    * {
        box-sizing: border-box;
    }
    /* (a double tap doesn't zoom - quick taps of the player's buttons would, on iPhones; pinching still zooms) */
    html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
    }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    button, input {
        font: inherit;
        color: inherit;
    }
    button {
        cursor: pointer;
        touch-action: manipulation;
    }
    [hidden] {
        display: none !important;
    }
    .muted {
        color: var(--muted);
    }
    .icon {
        width: 24px;
        height: 24px;
        fill: currentColor;
        flex: none;
    }

    /* Views */
    .view {
        max-width: 760px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 16px);
    }
    /* (the library's end clear of the mini player and the back-to-top button above it) */
    #libraryView {
        padding-bottom: calc(env(safe-area-inset-bottom) + 144px);
    }
    h1, h2 {
        margin: 0;
        line-height: 1.2;
    }
    .masthead {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 14px;
    }
    /* (the icon the height of the title and the tagline) */
    .masthead-icon {
        flex: none;
        width: calc(1.75rem * 1.1 + 2px + 1rem * 1.3);
        height: calc(1.75rem * 1.1 + 2px + 1rem * 1.3);
    }
    .about-button {
        position: absolute;
        top: 0;
        right: 0;
        min-height: 40px;
        padding: 0 4px;
        border: 0;
        background: none;
        font-size: 0.9rem;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
    }
    .about-button:hover, .about-button:focus-visible {
        color: var(--text);
    }
    .masthead h1 {
        font: 700 1.75rem/1.1 Georgia, "Iowan Old Style", "Times New Roman", serif;
    }
    .masthead p {
        margin: 2px 0 0;
        line-height: 1.3;
    }
    .library-section {
        margin-top: 28px;
    }

    /* Book covers - an image, or a generated cover */
    .cover {
        position: relative;
        flex: none;
        width: 56px;
        aspect-ratio: 2 / 3;
        border-radius: 4px;
        overflow: hidden;
        background: var(--surface-2);
        box-shadow: var(--shadow);
    }
    .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .cover .generated {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6%;
        text-align: center;
        font: 700 0.6rem/1.15 Georgia, serif;
        color: #fff;
        overflow: hidden;
    }

    /* Book lists */
    .book-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
    }
    .book-row {
        display: flex;
        align-items: center;
        gap: 4px;
        border-radius: 10px;
    }
    .book-open {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px;
        border: 0;
        border-radius: 10px;
        background: none;
        text-align: left;
    }
    .book-open:hover, .book-open:focus-visible {
        background: var(--surface-2);
    }
    .book-text {
        min-width: 0;
        display: grid;
        gap: 2px;
    }
    .book-title {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
    }
    .book-meta {
        font-size: 0.875rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .mini-progress {
        height: 3px;
        margin-top: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
        width: 100%;
        max-width: 220px;
    }
    .mini-progress > div {
        height: 100%;
        background: var(--accent);
    }
    .icon-button {
        flex: none;
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--muted);
    }
    .icon-button:hover, .icon-button:focus-visible {
        background: var(--surface-2);
        color: var(--text);
    }

    /* The library's groups - an author or a genre, its books shown when opened */
    .group {
        border-bottom: 1px solid var(--border);
    }
    .group > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 0 8px;
        list-style: none;
        cursor: pointer;
        font-weight: 600;
    }
    .group > summary::-webkit-details-marker {
        display: none;
    }
    .group > summary .icon {
        width: 18px;
        height: 18px;
        color: var(--muted);
        transform: rotate(180deg);
        transition: transform 0.15s;
    }
    .group[open] > summary .icon {
        transform: rotate(270deg);
    }
    .group-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .group-count {
        font-weight: 400;
        font-size: 0.875rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }
    .group > .book-list {
        padding: 0 0 8px 4px;
    }
    .group-link {
        display: block;
        min-height: 40px;
        padding: 0 8px;
        border: 0;
        background: none;
        font-size: 0.9rem;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
    }
    /* A linked group shown alone - its header (All authors or genres, its name and book count), and its books */
    .focus-head {
        padding: 2px 0 6px;
        border-bottom: 1px solid var(--border);
    }
    .focus-all {
        min-height: 40px;
        margin-left: -4px;
        padding: 0 4px;
        border: 0;
        background: none;
        font-size: 0.9rem;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
    }
    .focus-all:hover, .focus-all:focus-visible {
        color: var(--text);
    }
    .focus-name {
        margin: 2px 0 0;
        font: 700 1.35rem/1.25 Georgia, "Iowan Old Style", serif;
        overflow-wrap: anywhere;
    }
    .focus-count {
        margin: 2px 0 0;
        font-size: 0.875rem;
    }
    .group.focused {
        border-bottom: 0;
    }
    .group.focused > summary {
        display: none;
    }
    .group.focused > .book-list {
        padding: 8px 0 8px;
    }
    .group-more {
        display: block;
        width: 100%;
        margin: 0 0 10px;
    }
    .view-tabs {
        margin-top: 12px;
    }
    .view-tabs button {
        min-height: 34px;
        font-size: 0.875rem;
    }
    .round-play {
        flex: none;
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    /* Discover - sources and search */
    .tabs {
        display: flex;
        gap: 6px;
        padding: 4px;
        border-radius: 12px;
        background: var(--surface-2);
    }
    .tabs button {
        flex: 1;
        min-height: 40px;
        border: 0;
        border-radius: 9px;
        background: none;
        font-weight: 600;
        color: var(--muted);
    }
    .tabs button[aria-selected="true"] {
        background: var(--surface);
        color: var(--accent);
        box-shadow: var(--shadow);
    }
    /* (the books' scope - the library, Wikipedia, or my library - stands out: the accent, as the play button) */
    .scope-tabs button[aria-selected="true"] {
        background: var(--accent);
        color: var(--accent-text);
    }
    /* A narrow phone - the scopes fit on one line in 320px */
    @media (max-width: 380px) {
        .scope-tabs button {
            padding: 0 2px;
            font-size: 0.9375rem;
            white-space: nowrap;
        }
    }
    .search {
        display: flex;
        gap: 8px;
        margin-top: 12px;
    }
    .search input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
    }
    .button {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        font-weight: 600;
    }
    .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
    }
    .source-note {
        margin: 8px 2px 10px;
        font-size: 0.875rem;
    }
    .list-status {
        margin: 12px 2px;
        color: var(--muted);
    }
    .list-status.error {
        color: var(--error);
    }
    #more {
        display: block;
        width: 100%;
        margin-top: 10px;
    }

    /* The bottom dock - the back-to-top button above the mini player, fixed at the bottom (the dock lets taps through) */
    .bottom-dock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        pointer-events: none;
    }
    .bottom-dock > * {
        pointer-events: auto;
    }
    .to-top {
        align-self: flex-end;
        width: 44px;
        height: 44px;
        margin: 0 calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--muted);
        box-shadow: var(--shadow);
    }
    .to-top:hover, .to-top:focus-visible {
        color: var(--text);
    }
    .to-top .icon {
        width: 22px;
        height: 22px;
    }
    .to-top.above-mini-player {
        margin-bottom: 10px;
    }

    /* The mini player */
    .mini-player {
        padding: 8px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px);
        background: var(--surface);
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
    }
    .mini-player-inner {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .mini-player .cover {
        width: 34px;
    }
    .mini-player .book-open {
        padding: 4px;
    }
    .mini-player .round-play {
        width: 44px;
        height: 44px;
    }

    /* The player */
    /* The player fills the viewport exactly and never scrolls - the cover shrinks (or hides) to make room */
    .player {
        max-width: 520px;
        height: 100vh;
        height: 100dvh;
        padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .player-bar {
        display: flex;
        align-items: center;
        gap: 2px;
        margin: -6px -8px 0;
    }
    .player-bar .spacer {
        flex: 1;
    }
    .back {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        min-height: 44px;
        padding: 0 10px 0 4px;
        border: 0;
        border-radius: 10px;
        background: none;
        font-weight: 600;
    }
    .back:hover, .back:focus-visible {
        background: var(--surface-2);
    }
    .now-playing {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        padding-top: 8px;
        container-type: inline-size;
    }
    .now-playing .cover {
        flex: 1 1 0;
        min-height: 0;
        max-height: 330px;
        width: auto;
        max-width: 100%;
        border-radius: 8px;
        margin: 8px 0 14px;
    }
    @media (max-height: 560px) {
        .now-playing .cover {
            display: none;
        }
        .now-playing {
            justify-content: center;
        }
    }
    .now-playing .cover .generated {
        font-size: 1.1rem;
    }
    /* (the cover is a button - the book's details) */
    .cover-button {
        display: block;
        padding: 0;
        border: 0;
    }
    .cover-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
    }
    #bookTitle {
        font: 700 1.35rem/1.25 Georgia, "Iowan Old Style", serif;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
    }
    #bookAuthor, #chapterTitle {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    #bookAuthor {
        margin: 0;
        color: var(--muted);
    }
    #chapterTitle {
        margin: 10px 0 0;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--accent);
        min-height: 1.3em;
    }
    /* The sentence, in a box three lines tall - a long one in smaller type, sized to fit its length (--chars, set by
       app.js) at Georgia's average character width (0.52em - measured on book sentences in the player's widths): in
       three lines, or in four (the box's height at 0.7875rem), whichever is larger, down to 0.75rem */
    #sentence {
        --chars: 1;
        flex: none;
        margin: 6px 0 0;
        height: 4.725rem;
        max-width: 100%;
        font: 1.05rem/1.5 Georgia, "Iowan Old Style", serif;
        font-size: max(0.75rem, min(300cqi / (var(--chars) * 0.52), 1.05rem), min(400cqi / (var(--chars) * 0.52), 0.7875rem));
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
    }
    .progress {
        flex: none;
        width: 100%;
        margin-top: 14px;
    }
    .track {
        height: 6px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
    }
    #progressFill {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.25s linear;
    }
    .progress-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 0.8125rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }
    .transport {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        margin-top: 18px;
    }
    .skip {
        width: 64px;
        height: 64px;
        border: 0;
        border-radius: 50%;
        background: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .skip:hover, .skip:focus-visible {
        background: var(--surface-2);
    }
    .skip .icon {
        width: 40px;
        height: 40px;
    }
    .section-skip {
        width: 48px;
        height: 48px;
    }
    .section-skip .icon {
        width: 26px;
        height: 26px;
    }
    .skip:disabled {
        opacity: 0.35;
    }
    .transport button {
        flex: none;
    }
    /* A phone - the five transport buttons fit (and keep their circles) in 320px */
    @media (max-width: 420px) {
        .transport {
            gap: 0;
            justify-content: space-evenly;
        }
        .skip {
            width: 56px;
            height: 56px;
        }
        .skip .icon {
            width: 36px;
            height: 36px;
        }
        .section-skip {
            width: 44px;
            height: 44px;
        }
        .section-skip .icon {
            width: 24px;
            height: 24px;
        }
        .transport #playPause {
            width: 72px;
            height: 72px;
        }
    }
    #playPause {
        width: 80px;
        height: 80px;
    }
    #playPause .icon {
        width: 38px;
        height: 38px;
    }
    #playerStatus {
        flex: none;
        margin: 10px 0 0;
        min-height: 1.4em;
        font-size: 0.875rem;
        color: var(--muted);
    }
    #playerStatus.error {
        color: var(--error);
    }
    .spinner {
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* Sheets */
    dialog.sheet {
        width: 100%;
        max-width: 560px;
        max-height: 85dvh;
        margin: auto auto 0;
        padding: 0;
        border: 0;
        border-radius: 16px 16px 0 0;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
    }
    @media (min-width: 640px) {
        dialog.sheet {
            margin: auto;
            border-radius: 16px;
        }
    }
    dialog.sheet::backdrop {
        background: rgba(0, 0, 0, 0.4);
    }
    .sheet-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 8px 10px 18px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
    }
    .sheet-head h2 {
        flex: 1;
        font-size: 1.1rem;
    }
    .about-links {
        margin: 0;
        padding-left: 20px;
        line-height: 1.8;
    }
    .about-links a {
        color: var(--accent);
    }
    .sheet-body {
        padding: 12px 12px calc(env(safe-area-inset-bottom) + 20px);
    }
    .sheet-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
    }
    .sheet-item {
        display: flex;
        align-items: center;
        gap: 2px;
    }
    .sheet-go {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 2px;
        min-height: 48px;
        padding: 8px 10px;
        border: 0;
        border-radius: 10px;
        background: none;
        text-align: left;
    }
    .sheet-go:hover, .sheet-go:focus-visible {
        background: var(--surface-2);
    }
    .sheet-go[aria-current="true"] {
        color: var(--accent);
        font-weight: 600;
    }
    .sheet-go .label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .sheet-go .detail {
        font-size: 0.8125rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .sheet-item input {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 10px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--bg);
    }
    .sheet-empty {
        padding: 16px 10px;
        color: var(--muted);
    }
    .setting {
        padding: 6px 6px 14px;
    }
    .setting h3 {
        margin: 0 0 8px;
        font-size: 0.9375rem;
    }
    .setting p {
        margin: 10px 2px 0;
        font-size: 0.875rem;
    }
    .reset-setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .setting.reset-setting p {
        margin: 0 2px;
    }
    .reset-setting .button {
        flex-shrink: 0;
    }
    .voice-select {
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-weight: 600;
    }
    .confirm-message {
        margin: 4px 6px 18px;
    }
    .confirm-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }
    /* The book details sheet */
    .details-head {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 6px 6px 0;
    }
    .details-head .cover {
        width: 96px;
        border-radius: 6px;
    }
    .details-head .cover .generated {
        font-size: 0.8rem;
    }
    .details-text {
        min-width: 0;
        display: grid;
        gap: 2px;
    }
    .details-title {
        margin: 0;
        font: 700 1.2rem/1.25 Georgia, "Iowan Old Style", serif;
        overflow-wrap: anywhere;
    }
    .details-subtitle {
        margin: 0;
        font: 1rem/1.3 Georgia, "Iowan Old Style", serif;
        color: var(--muted);
    }
    .details-author {
        margin: 4px 0 0;
    }
    .details-length {
        margin: 0;
        font-size: 0.875rem;
    }
    .details-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 16px 6px 2px;
    }
    .details-actions .button {
        flex: 1 1 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }
    .details-actions .icon {
        width: 20px;
        height: 20px;
    }
    .details-description {
        margin: 14px 6px 0;
    }
    .details-section {
        padding: 14px 6px 0;
    }
    .details-section h3 {
        margin: 0 0 6px;
        font-size: 0.9375rem;
    }
    .details-section p {
        margin: 0;
        font-size: 0.875rem;
    }
    .details-section a {
        color: var(--accent);
    }
    .details-genres {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .details-genres li {
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        font-size: 0.8125rem;
        font-weight: 600;
    }
    .add-bookmark {
        width: 100%;
        margin-bottom: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    /* The startup timeline overlay (?timing) */
    .timing-overlay {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: 8px;
        z-index: 100;
        max-height: 40vh;
        overflow: auto;
        margin: 0;
        padding: 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.82);
        color: #e8f0e8;
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        pointer-events: none;
    }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.9-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-busy" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2.5A6.5 6.5 0 1 1 12 5.5z"/></symbol>
    <symbol id="i-sentence-back" viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 1-15.7 19h3.1A13 13 0 1 0 24 11v5l-8-6.5L24 3z"/><rect x="17" y="20.5" width="14" height="2.6" rx="1.3"/><rect x="17" y="26" width="9" height="2.6" rx="1.3"/></symbol>
    <symbol id="i-sentence-forward" viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 0 15.7 19h-3.1A13 13 0 1 1 24 11v5l8-6.5L24 3z"/><rect x="17" y="20.5" width="14" height="2.6" rx="1.3"/><rect x="17" y="26" width="9" height="2.6" rx="1.3"/></symbol>
    <symbol id="i-section-back" viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7 8.5 6V6z"/></symbol>
    <symbol id="i-section-forward" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 18l8.5-6L6 6z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="m12 2.6 4.7 4.7-1.4 1.4L13 6.4V15h-2V6.4L8.7 8.7 7.3 7.3zM5 10h4v2H6v8h12v-8h-3v-2h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></symbol>
    <symbol id="i-contents" viewBox="0 0 24 24"><path d="M4 6h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8z"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1zm1 2v12.3l5-3.2 5 3.2V5z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 6h10.2a3 3 0 0 1 5.6 0H21v2h-2.2a3 3 0 0 1-5.6 0H3zm13 2a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM3 16h2.2a3 3 0 0 1 5.6 0H21v2H10.8a3 3 0 0 1-5.6 0H3zm5 2a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 17.2V20h2.8l9.4-9.4-2.8-2.8zm15.7-9.5a1 1 0 0 0 0-1.4l-2-2a1 1 0 0 0-1.4 0l-1.6 1.6 2.8 2.8z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm0 1.8a7.2 7.2 0 1 0 0 14.4 7.2 7.2 0 0 0 0-14.4z"/><circle cx="12" cy="8.1" r="1.2"/><rect x="11.1" y="10.4" width="1.8" height="6.4" rx="0.9"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M11 20V7.8l-5.6 5.6L4 12l8-8 8 8-1.4 1.4L13 7.8V20z"/></symbol>
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7zm4 2v8h1.5v-8zm3.5 0v8H15v-8z"/></symbol>
</svg>

<main id="libraryView" class="view" hidden>
    <header class="masthead">
        <img class="masthead-icon" src="icon.svg" alt="" width="54" height="54">
        <div>
            <h1>PicoShelf</h1>
            <p class="muted">Classic books, read aloud.</p>
        </div>
        <button id="aboutButton" class="about-button" type="button">About</button>
    </header>

    <section class="library-section">
        <div id="scopeTabs" class="tabs scope-tabs" role="tablist" aria-label="Books"></div>
        <form id="searchForm" class="search" role="search">
            <input id="search" type="search" placeholder="Search titles and authors" aria-label="Search titles and authors" enterkeyhint="search" autocomplete="off">
            <button class="button" type="submit">Search</button>
        </form>
        <div id="viewTabs" class="tabs view-tabs" role="tablist" aria-label="View"></div>
        <p id="sourceNote" class="source-note muted"></p>
        <div id="results"></div>
        <p id="resultsStatus" class="list-status" role="status"></p>
        <button id="more" class="button" type="button" hidden>More</button>
    </section>
</main>

<div class="bottom-dock">
    <button id="toTop" class="to-top" type="button" aria-label="Back to top" title="Back to top" hidden><svg class="icon"><use href="#i-up"/></svg></button>
    <div id="miniPlayer" class="mini-player" hidden>
        <div class="mini-player-inner" id="miniPlayerInner"></div>
    </div>
</div>

<main id="playerView" class="view player" hidden>
    <div class="player-bar">
        <button id="toLibrary" class="back" type="button"><svg class="icon"><use href="#i-chevron"/></svg>Library</button>
        <span class="spacer"></span>
        <button id="shareButton" class="icon-button" type="button" aria-label="Share" title="Share"><svg class="icon"><use href="#i-share"/></svg></button>
        <button id="contentsButton" class="icon-button" type="button" aria-label="Contents" title="Contents"><svg class="icon"><use href="#i-contents"/></svg></button>
        <button id="bookmarksButton" class="icon-button" type="button" aria-label="Bookmarks" title="Bookmarks"><svg class="icon"><use href="#i-bookmark"/></svg></button>
        <button id="settingsButton" class="icon-button" type="button" aria-label="Narrator and speed" title="Narrator and speed"><svg class="icon"><use href="#i-settings"/></svg></button>
    </div>
    <div class="now-playing">
        <button id="playerCover" class="cover cover-button" type="button" aria-label="About this book" title="About this book"></button>
        <h1 id="bookTitle"></h1>
        <p id="bookAuthor"></p>
        <p id="chapterTitle"></p>
        <p id="sentence" lang="en"></p>
        <div class="progress">
            <div class="track" role="progressbar" aria-label="Progress through the book" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div id="progressFill"></div></div>
            <div class="progress-labels"><span id="percent">0%</span><span id="remaining"></span></div>
        </div>
        <div class="transport">
            <button id="sectionBack" class="skip section-skip" type="button" aria-label="Previous section" title="Previous section"><svg class="icon"><use href="#i-section-back"/></svg></button>
            <button id="skipBack" class="skip" type="button" aria-label="Previous sentence" title="Previous sentence"><svg class="icon"><use href="#i-sentence-back"/></svg></button>
            <button id="playPause" class="round-play" type="button" aria-label="Play"><svg class="icon"><use href="#i-play"/></svg></button>
            <button id="skipForward" class="skip" type="button" aria-label="Next sentence" title="Next sentence"><svg class="icon"><use href="#i-sentence-forward"/></svg></button>
            <button id="sectionForward" class="skip section-skip" type="button" aria-label="Next section" title="Next section"><svg class="icon"><use href="#i-section-forward"/></svg></button>
        </div>
        <p id="playerStatus" role="status"></p>
    </div>
</main>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button id="sheetClose" class="icon-button" type="button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
</dialog>

<script type="module">
import {main} from './lib/app.js';
main(window);
</script>
</body>
</html>
